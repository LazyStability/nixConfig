#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = $PREFIX udiskie &
# exec-once = $PREFIX waybar &
exec-once = $PREFIX hyprsunset --temperature 3000 &

# Bluelight filter
# exec-once = $PREFIX dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
# exec = $PREFIX hyprshade auto

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# New Nvdia problem ref: https://github.com/hyprwm/Hyprland/issues/8036
cursor {
    no_hardware_cursors = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
device {
  name=ydotoold-virtual-device
  kb_layout=us
  kb_options=
  kb_variant=
}

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Volume control
binde= , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # [hidden]
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # [hidden]
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , xf86Sleep, exec, systemctl suspend  # sleep button

bindl=, XF86AudioPlay, exec, playerctl play-pause # the stupid key is called play , but it toggles 
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $terminal zsh -fdc $filemanager
bind = $mainMod, M, exec, $terminal zsh -fdc $music-player
bind = $mainMod, I, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $mainMod&SHIFT_L, PRINT, exec, hyprshot -m region

## Native ##
bind = $mainMod, Q, killactive,
bind = $mainMod&SHIFT_L, M, $EXIT
bind = $mainMod&SHIFT_L, N, exec, hyprlock
bind = $mainMod, V, togglefloating,
bind = $mainMod, z, fullscreen
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle

# LDUR
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Switch windows
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, l, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move to scratchpads
bind = $mainMod SHIFT, K, movetoworkspace, special:scratchpad_1
bind = $mainMod SHIFT, L, movetoworkspace, special:scratchpad_2

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


####################
### KEYMAPS ########
####################

bind = $mainMod, R, exec, dbus-send --session --type=method_call --dest=org.keepassxc.KeePassXC.MainWindow /keepassxc org.keepassxc.KeePassXC.MainWindow.requestGlobalAutoType
bind = $mainMod, D, submap, scratchpads + scripts

submap = scratchpads + scripts

#############
## Scripts ##
#############
# TODO: remove these scripts from path
binde = $mainMod, O, exec, toggle-recording-script
binde = $mainMod, O, submap, reset
binde = $mainMod, T, exec, save-recording-script
binde = $mainMod, T, submap, reset
binde = $mainMod, I, exec, $PREFIX windowswitcher
binde = $mainMod, I, submap, reset
binde = $mainMod, B, exec, $PREFIX bookmark
binde = $mainMod, B, submap, reset
binde = $mainMod, E, exec, $PREFIX emoji-picker
binde = $mainMod, E, submap, reset
binde = $mainMod, M, exec, $PREFIX move-workspace-to-monitor
binde = $mainMod, M, submap, reset
#################
## Scratchpads ##
#################

## AUDIO ##
binde = $mainMod, S, togglespecialworkspace, scratchpad_audiomanager
binde = $mainMod, S, exec, if hyprctl clients | grep $audiomanager; then echo "scratchpad_audiomanager respawn not needed"; else $PREFIX $audiomanager; fi
binde = $mainMod, S, submap, reset

## BLUETOOTH ##
binde = $mainMod, D, togglespecialworkspace, scratchpad_bluetooth
binde = $mainMod, D, exec, if hyprctl clients | grep "$bluetoothmanager"; then echo "scratchpad_bluetooth" respawn not needed; else $PREFIX $bluetoothmanager; fi
binde = $mainMod, D, submap, reset

## TERMINAL ##
binde = $mainMod, F, togglespecialworkspace, scratchpad_terminal
binde = $mainMod, F, exec, if hyprctl clients | grep scratchpad_term; then echo "scratchpad_term respawn not needed"; else $PREFIX $terminal --class scratchpad_terminal; fi
binde = $mainMod, F, submap, reset

## NETWORKMANAGER ##
binde = $mainMod, H, togglespecialworkspace, scratchpad_network
binde = $mainMod, H, exec, if hyprctl clients | grep "$networkmanager"; then echo "scratchpad_network respawn not needed"; else $PREFIX $networkmanager; fi
binde = $mainMod, H, submap, reset

## QUICK CAPTURE ##
binde = $mainMod, J, togglespecialworkspace, scratchpad_quick_capture
binde = $mainMod, J, exec, if hyprctl clients | grep scratchpad_quick_capture; then echo "scratchpad_quick_capture respawn not needed"; else $PREFIX $terminal --class scratchpad_quick_capture -- sh quickcapture; fi
binde = $mainMod, J, submap, reset

## SCRATCHPAD1 & 2 ##
binde = $mainMod, K, togglespecialworkspace, scratchpad_1
binde = $mainMod, K, submap, reset
binde = $mainMod, L, togglespecialworkspace, scratchpad_2
binde = $mainMod, L, submap, reset

# Exit submap
binde = , catchall, submap, reset
submap = reset

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 1
    gaps_out = 5

    border_size = 2

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow{
        # This is managed in the nix part of the config because it changes depending on the energy settings
        # enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        # This is managed in the nix part of the config because it changes depending on the energy settings
        # enabled = true
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 6, default, slidefadevert -50%

}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# Smart gaps/ No gaps if single window
# https://wiki.hypr.land/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    # This is managed in the nix part of the config because it changes depending on the energy settings
    # disable_autoreload = true
    # vfr = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Wildcard for randomly plugged in monitors like projectors
monitor = , preferred, auto, 1

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
#
# Declare basic setups for workspaces
# Monitor 1
workspace =  4, name:Terminal, monitor:$monitor1, on-created-empty: $PREFIX $terminal
workspace =  1, name:Browser, monitor:$monitor1
workspace =  7, name:Gaming, monitor:$monitor1
workspace =  6, monitor:$monitor1
workspace =  8, monitor:$monitor1
workspace =  9, monitor:$monitor1
workspace = 10, monitor:$monitor1

# monitor 2
workspace =  2, monitor:$monitor2
workspace =  3, name:Secret, monitor:$monitor2, on-created-empty: $PREFIX keepassxc
workspace =  5, name:Comms, monitor:$monitor2

###################
### WINDOWRULES ###
###################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

## mpv ##
windowrulev2 = fullscreen, class:mpv

## Browser ##
windowrulev2 = workspace 1, tag:Browser
windowrulev2 = tag +Browser, class:firefox-esr
windowrulev2 = tag +Browser, class:Brave-browser
windowrulev2 = tag +Browser, class:zen

## Secrets ##
# windowrulev2 = workspace 3, tag:Secret
# windowrulev2 = tag +Secret, class:org.keepassxc.KeePassXC
# windowrulev2 = tag -Secret, initialTitle: Auto-Type - KeePassXc
windowrulev2 =  float, initialTitle:Auto-Type*

## Comms ##
windowrulev2 = workspace 5, tag:Comms
windowrulev2 = tag +Comms, class:vesktop
windowrulev2 = tag +Comms, class:Signal
windowrulev2 = tag +Comms, class:Element

## EMAIL ##
windowrulev2 = workspace 6, tag:Email
windowrulev2 = tag +Email, class:thunderbird

## Gaming ##
windowrulev2 = workspace 7, tag:Gaming
#All steam windows are gaming
windowrulev2 = tag +Gaming, class:steam
windowrulev2 = tag +Gaming, class:steam\_app\_[0-9]{6,7}


## Special Workspaces ##
# Scratchpads
$scratchpadsize = size 80% 85%

## AUDIO ##
$scratchpad_audiomanager = class:($audiomanager)
windowrulev2 = float,$scratchpad_audiomanager
windowrulev2 = size 86% 40%,$scratchpad_audiomanager
windowrulev2 = workspace special:scratchpad_audiomanager silent,$scratchpad_audiomanager
windowrulev2 = opacity 0.80,$scratchpad_audiomanager

## BLUETOOTH ##
$scratchpad_bluetooth = class:($bluetoothmanager)
windowrulev2 = float,$scratchpad_bluetooth
windowrulev2 = $scratchpadsize,$scratchpad_bluetooth
windowrulev2 = workspace special:scratchpad_bluetooth ,$scratchpad_bluetooth
windowrulev2 = center,$scratchpad_bluetooth
windowrulev2 = opacity 0.80,$scratchpad_bluetooth

## TERMINAL ##
$scratchpad_terminal = class:(scratchpad_terminal)
windowrulev2 = float,$scratchpad_terminal
windowrulev2 = $scratchpadsize,$scratchpad_terminal
windowrulev2 = workspace special:scratchpad_terminal ,$scratchpad_terminal
windowrulev2 = center,$scratchpad_terminal
windowrulev2 = opacity 0.80,$scratchpad_terminal


## NETWORKMANAGER ##
$scratchpad_network = class:^($networkmanager)$
windowrulev2 = float,$scratchpad_network
windowrulev2 = $scratchpadsize,$scratchpad_network
windowrulev2 = workspace special:scratchpad_network ,$scratchpad_network
windowrulev2 = center,$scratchpad_network
windowrulev2 = opacity 0.80,$scratchpad_network

## QUICK CAPTURE ##
$scratchpad_quick_capture = class:^(scratchpad_quick_capture)$
windowrulev2 = float,$scratchpad_quick_capture
windowrulev2 = $scratchpadsize,$scratchpad_quick_capture
windowrulev2 = workspace special:scratchpad_quick_capture ,$scratchpad_quick_capture
windowrulev2 = center,$scratchpad_quick_capture
windowrulev2 = opacity 0.80,$scratchpad_quick_capture

