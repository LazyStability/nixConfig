clear_all_shortcuts yes
kitty_mod           ctrl+shift

# copy & paste
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

##########
## Font ##
##########

font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures cursor

##############
## Sessions ##
##############
tab_bar_filter session:~ or session:^$

map kitty_mod+f launch  /data/Software/kitty-stuff/kitty-sessionizer.sh
map kitty_mod+s save_as_session --relocatable --use-foreground-process --match=session:. .
map kitty_mod+w goto_session -1
map kitty_mod+esc close_session


##########
## Tabs ##
##########

# open tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+R close_tab

# Move in tabs
map kitty_mod+n next_tab
map kitty_mod+p previous_tab

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 0

# Rename tab
map kitty_mod+, set_tab_title

# Broadcast to all windows
map f1 launch --allow-remote-control kitty +kitten broadcast

#############
## Windows ##
#############
# Open splits
map kitty_mod+SPACE launch --location=hsplit --cwd=current
map kitty_mod+ENTER launch --location=vsplit --cwd=current

# Close windows
map kitty_mod+Q close_window

# Kitty navigation
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --when-focus-on var:IS_NVIM kitty_mod+j
map --when-focus-on var:IS_NVIM kitty_mod+k
map --when-focus-on var:IS_NVIM kitty_mod+h
map --when-focus-on var:IS_NVIM kitty_mod+l


# the 3 here is the resize amount, adjust as needed
map alt+j kitten relative_resize.py down  3
map alt+k kitten relative_resize.py up    3
map alt+h kitten relative_resize.py left  3
map alt+l kitten relative_resize.py right 3

map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM al

# For linux only:
allow_remote_control yes
listen_on unix:@mykitty

shell_integration enabled
# kitty-scrollback.nvim Kitten alias
# TODO: Change this hardcoded path
action_alias kitty_scrollback_nvim kitten /home/me/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+b kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Other unix systems:
# allow_remote_control yes
# listen_on unix:/tmp/mykittyt+l

# Layouts
enabled_layouts splits,stack
map kitty_mod+z combine : toggle_layout stack : scroll_prompt_to_bottom
tab_title_template "{' #' if layout_name == 'stack' else '  '}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}  "

# delete whole word
map ctrl+backspace send_text all \x17

#################
## Kitty Hints ##
#################
# Taken from here: https://github.com/ghostty-org/ghostty/discussions/2394
# files/paths
map kitty_mod+o>f    kitten hints --program linkhandler --type regex --regex "[a-zA-Z0-9./_~-]+"
map kitty_mod+i>f    kitten hints --program - --type regex --regex "[a-zA-Z0-9./_~-]+"
map kitty_mod+y>f    kitten hints --program @ --type regex --regex "[a-zA-Z0-9./_~-]+"

# hashes
map kitty_mod+i>h    kitten hints --program - --type hash
map kitty_mod+y>h    kitten hints --program @ --type hash
map kitty_mod+o>h    kitten hints --program linkhandler --type hash

# URLs
map kitty_mod+i>u    kitten hints --program - --type url
map kitty_mod+y>u    kitten hints --program @ --type url
map kitty_mod+o>u    kitten hints --program linkhandler --type url

# words
map kitty_mod+i>w    kitten hints --program - --type word
map kitty_mod+y>w    kitten hints --program @ --type word
map kitty_mod+o>w    kitten hints --program linkhandler --type word

# addresses (pointers)
map kitty_mod+i>a    kitten hints --program - --type regex --regex "0x[a-fA-F0-9]+"
map kitty_mod+y>a    kitten hints --program @ --type regex --regex "0x[a-fA-F0-9]+"
map kitty_mod+o>a    kitten hints --program linkhandler --type regex --regex "0x[a-fA-F0-9]+"

# MSCs
map kitty_mod+i>m    kitten hints --program - --type regex --regex "(?i:MSC)[0-9]{3,4}"
map kitty_mod+y>m    kitten hints --program @ --type regex --regex "(?i:MSC)[0-9]{3,4}"
map kitty_mod+o>m    kitten hints --program linkhandler --type regex --regex "(?i:MSC)[0-9]{3,4}"

# CVEs / GHSAs
map kitty_mod+i>c    kitten hints --program - --type regex --regex "(CVE-[0-9]{1,5}-[0-9]{1,5}|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})"
map kitty_mod+y>c    kitten hints --program @ --type regex --regex "(CVE-[0-9]{1,5}-[0-9]{1,5}|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})"
map kitty_mod+o>c    kitten hints --program linkhandler --type regex --regex "(CVE-[0-9]{1,5}-[0-9]{1,5}|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})"

# ELEMENTSEC / MATRIXSEC
map kitty_mod+i>s    kitten hints --program - --type regex --regex "((ELEMENT|MATRIX)SEC-[0-9]{4}-[0-9]{3,5})"
map kitty_mod+y>s    kitten hints --program @ --type regex --regex "((ELEMENT|MATRIX)SEC-[0-9]{4}-[0-9]{3,5})"
map kitty_mod+o>s    kitten hints --program linkhandler --type regex --regex "((ELEMENT|MATRIX)SEC-[0-9]{4}-[0-9]{3,5})"

# IPFS
map kitty_mod+i>i    kitten hints --program - --type regex --regex "(?:ipfs://)?Qm[a-zA-Z0-9]{44}"
map kitty_mod+y>i    kitten hints --program @ --type regex --regex "(?:ipfs://)?Qm[a-zA-Z0-9]{44}"
map kitty_mod+o>i    kitten hints --program linkhandler --type regex --regex "(?:ipfs://)?Qm[a-zA-Z0-9]{44}"

# RFCs
map kitty_mod+i>r    kitten hints --program - --type regex --regex "(?i:RFC)[ -]?[0-9]{3,4}"
map kitty_mod+y>r    kitten hints --program @ --type regex --regex "(?i:RFC)[ -]?[0-9]{3,4}"
map kitty_mod+o>r    kitten hints --program linkhandler --type regex --regex "(?i:RFC)[ -]?[0-9]{3,4}"
''
+ ''
