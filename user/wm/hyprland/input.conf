#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# New Nvdia problem ref: https://github.com/hyprwm/Hyprland/issues/8036
cursor {
    no_hardware_cursors = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $terminal zsh -fdc $filemanager
bind = $mainMod, I, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $mainMod&SHIFT_L, PRINT, exec, hyprshot -m region

## Native ##
bind = $mainMod, Q, killactive,
bind = $mainMod&SHIFT_L, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, z, fullscreen
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle

# LDUR
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Switch windows
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, l, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move to scratchpads
bind = $mainMod SHIFT, K, movetoworkspace, special:scratchpad_1
bind = $mainMod SHIFT, L, movetoworkspace, special:scratchpad_2

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


####################
### KEYMAPS ########
####################

bind = $mainMod, D, submap, scratchpads

submap = scratchpads

## AUDIO ##
binde = , S, togglespecialworkspace, scratchpad_audiomanager
binde = , S, exec, if hyprctl clients | grep $audiomanager; then echo "scratchpad_audiomanager respawn not needed"; else $audiomanager; fi

## BLUETOOTH ##
binde = , D, togglespecialworkspace, scratchpad_bluetooth
binde = , D, exec, if hyprctl clients | grep "$bluetoothmanager"; then echo "scratchpad_bluetooth" respawn not needed; else $bluetoothmanager; fi

## TERMINAL ##
binde = , F, togglespecialworkspace, scratchpad_terminal
binde = , F, exec, if hyprctl clients | grep scratchpad_term; then echo "scratchpad_term respawn not needed"; else $terminal --class scratchpad_terminal; fi

## NETWORKMANAGER ##
binde = , H, togglespecialworkspace, scratchpad_network
binde = , H, exec, if hyprctl clients | grep "$networkmanager"; then echo "scratchpad_network respawn not needed"; else $networkmanager; fi

## QUICK CAPTURE ##
binde = , J, togglespecialworkspace, scratchpad_quick_capture
binde = , J, exec, if hyprctl clients | grep scratchpad_quick_capture; then echo "scratchpad_quick_capture respawn not needed"; else $terminal --class scratchpad_quick_capture -- sh /home/me/Scripts/quickcapture.sh; fi

## SCRATCHPAD1 & 2 ##
binde = , K, togglespecialworkspace, scratchpad_1
binde = , L, togglespecialworkspace, scratchpad_2

# Exit submap
binde = , catchall, submap, reset
submap = reset
