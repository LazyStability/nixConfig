##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
#
# Declare basic setups for workspaces
# Monitor 1
workspace =  4, name:Terminal, monitor:$monitor1, on-created-empty:$terminal
workspace =  1, name:Browser, monitor:$monitor1
workspace =  7, name:Gaming, monitor:$monitor1, on-created-empty:steam && lutris
workspace =  2, monitor:$monitor1
workspace =  6, monitor:$monitor1
workspace =  8, monitor:$monitor1
workspace =  9, monitor:$monitor1
workspace = 10, monitor:$monitor1

# monitor 2
workspace =  3, name:Secret, monitor:$monitor2, on-created-empty:keepassxc
workspace =  5, name:Comms, monitor:$monitor2, on-created-empty:armcord && signal-desktop

