###################
### WINDOWRULES ###
###################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# Scratchpads
$scratchpadsize = size 80% 85%

## AUDIO ##
$scratchpad_audiomanager = class:($audiomanager)
windowrulev2 = float,$scratchpad_audiomanager
windowrulev2 = size 86% 40%,$scratchpad_audiomanager
windowrulev2 = workspace special:scratchpad_audiomanager silent,$scratchpad_audiomanager
windowrulev2 = opacity 0.80,$scratchpad_audiomanager

## BLUETOOTH ##
$scratchpad_bluetooth = class:($bluetoothmanager)
windowrulev2 = float,$scratchpad_bluetooth
windowrulev2 = $scratchpadsize,$scratchpad_bluetooth
windowrulev2 = workspace special:scratchpad_bluetooth ,$scratchpad_bluetooth
windowrulev2 = center,$scratchpad_bluetooth
windowrulev2 = opacity 0.80,$scratchpad_bluetooth

## TERMINAL ##
$scratchpad_terminal = class:(scratchpad_terminal)
windowrulev2 = float,$scratchpad_terminal
windowrulev2 = $scratchpadsize,$scratchpad_terminal
windowrulev2 = workspace special:scratchpad_terminal ,$scratchpad_terminal
windowrulev2 = center,$scratchpad_terminal
windowrulev2 = opacity 0.80,$scratchpad_terminal


## NETWORKMANAGER ##
$scratchpad_network = class:^($networkmanager)$
windowrulev2 = float,$scratchpad_network
windowrulev2 = $scratchpadsize,$scratchpad_network
windowrulev2 = workspace special:scratchpad_network ,$scratchpad_network
windowrulev2 = center,$scratchpad_network
windowrulev2 = opacity 0.80,$scratchpad_network

## QUICK CAPTURE ##
$scratchpad_quick_capture = class:^(scratchpad_quick_capture)$
windowrulev2 = float,$scratchpad_quick_capture
windowrulev2 = $scratchpadsize,$scratchpad_quick_capture
windowrulev2 = workspace special:scratchpad_quick_capture ,$scratchpad_quick_capture
windowrulev2 = center,$scratchpad_quick_capture
windowrulev2 = opacity 0.80,$scratchpad_quick_capture

