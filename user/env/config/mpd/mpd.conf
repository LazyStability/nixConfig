music_directory     "~/Musik"
playlist_directory  "/home/me/.local/share/mpd/playlists"
db_file             "/home/me/.local/share/mpd/tag_cache"
state_file          "/home/me/.local/share/mpd/state"
sticker_file        "/home/me/.local/share/mpd/sticker.sql"

bind_to_address     "127.0.0.1"
audio_output {
  type "pipewire"
  name "My PipeWire Output"
}
decoder {
  plugin "audiofile"
  enabled "yes"
}

