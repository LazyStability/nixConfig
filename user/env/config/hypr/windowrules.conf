##############################
### WINDOWS AND WORKSPACES ###
##############################

# Wildcard for randomly plugged in monitors like projectors
monitor = , preferred, auto, 1

# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
#
# Declare basic setups for workspaces
# Monitor 1
workspace =  4, name:Terminal, monitor:$monitor1, on-created-empty: $PREFIX $terminal
workspace =  1, name:Browser, monitor:$monitor1
workspace =  7, name:Gaming, monitor:$monitor1
workspace =  6, monitor:$monitor1
workspace =  8, monitor:$monitor1
workspace =  9, monitor:$monitor1
workspace = 10, monitor:$monitor1

# monitor 2
workspace =  2, monitor:$monitor2
workspace =  3, name:Secret, monitor:$monitor2, on-created-empty: $PREFIX keepassxc
workspace =  5, name:Comms, monitor:$monitor2

###################
### WINDOWRULES ###
###################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppress_event maximize, match:class .* # You'll probably like this.

## mpv ##
windowrule = fullscreen on, match:class mpv

## Browser ##
windowrule = workspace 1, match:tag Browser
windowrule = tag +Browser, match:class firefox-esr
windowrule = tag +Browser, match:class Brave-browser
windowrule = tag +Browser, match:class zen
windowrule = tag +Browser, match:class floorp

## Secrets ##
# windowrule = workspace 3, match:tag Secret
# windowrule = tag +Secret, match:class org.keepassxc.KeePassXC
# windowrule = tag -Secret, initialTitle: Auto-Type - KeePassXc
windowrule =  float on, match:initial_title Auto-Type*

## Comms ##
windowrule = workspace 5, match:tag Comms
windowrule = tag +Comms, match:class vesktop
windowrule = tag +Comms, match:class signal
windowrule = tag +Comms, match:class Element

## EMAIL ##
windowrule = workspace 6, match:tag Email
windowrule = tag +Email, match:class thunderbird

## Gaming ##
windowrule = workspace 7, match:tag Gaming
#All steam windows are gaming
windowrule = tag +Gaming, match:class steam
windowrule = tag +Gaming, match:class steam\_app\_[0-9]{6}|steam\_app\_[0-9]{7}
windowrule = tag +Gaming, match:class gamescope
windowrule = fullscreen on,  match:class gamescope
windowrule = idle_inhibit focus, match:class steam\_app\_[0-9]{6}|steam\_app\_[0-9]{7}
windowrule = idle_inhibit focus, match:class gamescope

## PDF Viewer ##
# For some reason the default is to have this window floating
windowrule = tile on,match:class sioyek


## Special Workspaces ##
# Scratchpads
windowrule = tag +Scratchpads, match:class (com.saivert.pwvucontrol)
windowrule = tag +Scratchpads, match:class (music-player)
windowrule = tag +Scratchpads, match:class (blueberry.py)
windowrule = tag +Scratchpads, match:class (scratchpad_terminal)
windowrule = tag +Scratchpads, match:class (vim_anywhere)
windowrule = tag +Scratchpads, match:class ^($networkmanager)$
windowrule = tag +Scratchpads, match:class ^(scratchpad_quick_capture)$

windowrule = float on,                          match:tag Scratchpads
windowrule = size (monitor_w*.8) (monitor_h*.5),match:tag Scratchpads
windowrule = center on,                         match:tag Scratchpads
windowrule = opacity 0.80,                      match:tag Scratchpads

## TERMINAL ##
windowrule = workspace special:scratchpad_terminal, match:class (scratchpad_terminal)
## QUICK CAPTURE ##
windowrule = workspace special:scratchpad_quick_capture, match:class ^(scratchpad_quick_capture)$
