$EXIT=exec, loginctl terminate-user $(whoami)
$PREFIX=uwsm app --
$audiomanager=pwvucontrol
$bluetoothmanager=blueberry
$browser=firefox.desktop
$discordClient=vesktop
$filemanager=yazi
$hypr-binds=/usr/bin/hyprland-binds
$hypr-lid-switch=/usr/bin/lid-switch-behaviour
$mainMod=SUPER
$menu=fuzzel --launch-prefix="uwsm app -- "
$monitor1=DP-1
$monitor2=DP-2
$move-workspace-to-monitor=/usr/bin/hyprland-move-workspace-to-monitor
$music-player=rmpc
$networkmanager=networkmanager_dmenu
$terminal=kitty
$windowswitcher=/usr/bin/hyprland-window-quickswitcher 
decoration {
  blur {
    enabled=true
  }

  shadow {
    color=rgba(24283b99)
    enabled=true
  }
}

general {
  col.active_border=rgb(41a6b5)
  col.inactive_border=rgb(565f89)
}

group {
  groupbar {
    col.active=rgb(41a6b5)
    col.inactive=rgb(565f89)
    text_color=rgb(c0caf5)
  }
  col.border_active=rgb(41a6b5)
  col.border_inactive=rgb(565f89)
  col.border_locked_active=rgb(1abc9c)
}

misc {
  background_color=rgb(24283b)
  disable_autoreload=false
  disable_hyprland_logo=true
  vfr=false
}

source =~/.config/hypr/autostart.conf
source =~/.config/hypr/input.conf
source =~/.config/hypr/keymaps.conf
source =~/.config/hypr/lookandfeel.conf
source =~/.config/hypr/windowrules.conf
source =~/.config/hypr/monitors.conf
