monitor.alsa.rules = [
	{
		matches = [
			{
				device.product.name = "Ryzen HD Audio Controller"
			}
			{
				device.product.name = "Radeon High Definition Audio Controller"
			}
			{
				device.product.name = "Navi 48 HDMI/DP Audio Controller"

			}
		]
    actions = {
        update-props = {
            device.disabled = "true"
        }
    }
	}
]
