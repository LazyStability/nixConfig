monitor.alsa.rules = [ {
    matches = [ {
        api.alsa.card.name = "Trust GXT 232 Microphone"
		}
    ]

    actions = {
        update-props = {
	    device.profile.description = "Pro"
	    device.profile.name = "pro-input-0"
	    device.profile.pro = "true"
            device.profile = "pro-audio"
            device.disabled = "false"
        }
    }
}
]
