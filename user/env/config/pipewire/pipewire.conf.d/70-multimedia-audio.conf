context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Multimedia Audio"
            media.name       = "Multimedia Audio"
            filter.graph = {
                nodes = [
                    {
                        # Equalizer to make music sound more gooder (aggressive v graph)
                        type = lv2
                        name = eq
                        plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_stereo"
                        control = {
                            "g_in" = 1
                            "g_out" = 0.794328
                            "ft_0" = 5
                            "f_0" = 70
                            "g_0" = 2.818
                            "q_0" = 0.2222
                            "ft_1" = 0
                            "f_1" = 182
                            "g_1" = 1.601
                            "q_1" = 0.2222
                            "ft_2" = 0
                            "f_2" = 322
                            "g_2" = 0.4449
                            "q_2" = 0.7778
                            "ft_3" = 0
                            "f_3" = 606
                            "g_3" = 1.1778
                            "q_3" = 0.8889
                            "ft_4" = 0
                            "f_4" = 1006
                            "g_4" = 0.7981
                            "q_4" = 0.22222
                            "ft_5" = 0
                            "f_5" = 2997
                            "g_5" = 0.8341
                            "q_5" = 0.22222
                            "ft_6" = 0
                            "f_6" = 6112
                            "g_6" = 0.9956
                            "q_6" = 2.6667
                            "ft_7" = 0
                            "f_7" = 5792
                            "g_7" = 2.8184
                            "q_7" = 0
                        }
                    }
                    {
                        # limiter to keep things below -1 dB max volume
                        type = lv2
                        name = lim
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "alr" = 1
                            "alr_at" = 5
                            "alr_rt" = 300
                            "th" = 0.89125
                            "boost" = 0
                            "lk" = 5
                            "at" = 5
                            "smooth" = -5
                        }
                    }
                ]
                links = [
                    { output = "eq:out_l" input = "lim:in_l" }
                    { output = "eq:out_r" input = "lim:in_r" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "multimedia_effect_input.eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "multimedia_effect_output.eq"
            # make sure filter only connects to desired device
            # you'll need the exact node.name for this to work, regex doesn't work here
            # use wpctl status to find id, then wpctl inspect <id> | grep node.name to get name
            node.target = "bluez_output.60_AB_D2_40_B2_F2.1"
            # node.passive is used for nodes that sit in front of sinks/sources and need to suspend together with the sink/source. 
            node.passive = true
            }
        }
    }
]
