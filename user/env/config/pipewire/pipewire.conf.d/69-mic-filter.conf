                    { output = "eq_clean:out" input = "comp:in"}
                    { output = "comp:out" input = "eq_boost:in" }
                    #{ output = "eq_boost:out" input = "limiter:in" }
                ]
            }
            capture.props = {
                node.name   = "capture.mic_filters"
                # target.object will want an exact node.name to connect properly
                # 'wpctl status' to get id, then 'wpctl inspect <id> | grep node.name'
                # to use a specific channel, append ':capture_<channel_name>' to node.name
                # channel_name will be listed in 'wpctl inspect <id> | grep audio.position'
                # for example "alsa_input.myaudiodevice:capture_FL" to use channel 1 of myaudiodevice
                # capture.props prefers target.object to node.target (maybe?)
                #target.object = ""
                node.passive = true            
                audio.rate = 48000
            }
            playback.props = {
                node.name =  "mic_filters"
                media.class = Audio/Source
                audio.rate = 48000
