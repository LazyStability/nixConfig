# Adding rules to prevent applications using microphone to auto adjust microphone volume

# Client/stream specific properties
pulse.rules = [
	{
		# Disable mic auto gain for some applications
		matches = [
			{application.process.binary = "chrome"}
			{application.process.binary = "Chromium input"}
			{application.process.binary = "Chromium"}
			{application.process.binary = "OBS"}
			{application.process.binary = "Discord"}
			{application.process.binary = "Vesktop"}
			{application.process.binary = "teams"}
		]
		actions = { quirks = [ block-source-volume] }
	}
]
