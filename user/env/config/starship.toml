add_newline = true
palette = "base16"

[character]
error_symbol = "[](bold red)"
success_symbol = "[➜](bold green)"

[directory.substitutions]
"~/.config/nvim" = ""
"/persist/etc/nixos" = ""
"~/Bilder" = " "
"~/Dokumente" = "󰈙 "
"~/Downloads" = " "
"~/Games" = "󰊗"
"~/Musik" = " "
"~/Software" = ""

[nix_shell]
format = "via [$symbol$state]($style)"

